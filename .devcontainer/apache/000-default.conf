# ============================================================================
#  CSDUV3 - VirtualHost del entorno de PRUEBAS
# ----------------------------------------------------------------------------
#  Plantilla. El marcador __DOCROOT__ (dos veces) lo sustituye
#  .devcontainer/setup.sh por la ruta real del proyecto dentro del contenedor
#  (por ejemplo /workspaces/csduv3/public). Así no se codifica a mano ni el
#  nombre del repositorio ni el punto de montaje.
#
#  Modelo A (el mismo que se usará en BanaHosting): únicamente la carpeta
#  public/ es accesible desde el navegador; app/, config/, database/,
#  storage/ y docs/ quedan fuera del alcance público.
#
#  AllowOverride All es imprescindible: public/.htaccess usa
#  Options, RewriteRule, Header y Require.
# ============================================================================
<VirtualHost *:8000>
    ServerName localhost
    ServerAdmin admin@example.invalid

    DocumentRoot __DOCROOT__

    <Directory __DOCROOT__>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
