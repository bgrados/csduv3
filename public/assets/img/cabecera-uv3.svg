  <circle cx="1340" cy="250" r="186" fill="none" stroke="#009f39" stroke-width="8" opacity="0.45"/>

  <g opacity="0.95">
    <image x="1240" y="150" width="200" height="200" preserveAspectRatio="xMidYMid meet"
           xlink:href="data:image/jpeg;base64,"/>
  </g>

  <g opacity="0.22" fill="#ffffff">
