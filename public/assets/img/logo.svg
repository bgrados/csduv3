<?xml version="1.0" encoding="UTF-8"?>
<!--
    Respaldo vectorial del logotipo UV3.
    El archivo institucional usado por la aplicación es assets/img/logo.jpg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Logotipo UV3">
    <rect width="64" height="64" rx="12" fill="#FEFE08"/>
    <rect x="1.5" y="1.5" width="61" height="61" rx="10.5" fill="none" stroke="#009F39" stroke-width="3"/>
    <text x="32" y="41" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24"
          font-weight="700" fill="#007A2C" letter-spacing="-1">UV3</text>
    <text x="32" y="53" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7"
          font-weight="600" fill="#007A2C" letter-spacing="1.2">CSDUV3</text>
</svg>
