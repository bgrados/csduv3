<?xml version="1.0" encoding="UTF-8"?>
<!--
    Logotipo provisional neutro.
    No representa el escudo oficial del club: debe reemplazarse por el archivo
    institucional cuando la institución lo proporcione.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Logotipo provisional">
    <rect width="64" height="64" rx="12" fill="#ffffff" opacity="0.12"/>
    <rect x="2" y="2" width="60" height="60" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="32" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17"
          font-weight="700" fill="#ffffff" letter-spacing="0.5">UV3</text>
    <text x="32" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8"
          fill="#ffffff" fill-opacity="0.75" letter-spacing="1.4">CSDUV3</text>
</svg>
